[workspace]
resolver = "3"
members = [ "capsul", "crates/crypto", "crates/manifest", "crates/shards"]

[workspace.dependencies]
crypto = { path = "crates/crypto" }
manifest = { path = "crates/manifest" }
shards = { path = "crates/shards" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
rpath = false
overflow-checks = false
