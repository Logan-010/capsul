[package]
name = "capsul"
version = "0.1.0"
edition = "2024"
authors = ["Logan-010"]
description = "Distributed reliable file storage"

[dependencies]
blake3 = { version = "1.8.7", features = ["mmap", "rayon", "serde"] }
chacha20poly1305 = "0.11.0"
ciborium = "0.2.2"
reed-solomon-simd = "3.1.0"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
rpath = false
overflow-checks = false

[dev-dependencies]
tempfile = "3.27.0"
