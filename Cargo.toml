[package]
name = "capsul"
version = "0.1.0"
edition = "2024"
authors = ["Logan-010"]
description = "Distributed reliable file storage"

[dependencies]
blake3 = { version = "1.8.7", features = ["mmap", "rayon", "serde"] }
chacha20poly1305 = "0.11.0"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
dashmap = "6.2.1"
iroh = { version = "1.4.1", default-features = false, features = ["portmapper", "tls-aws-lc-rs"] }
iroh-mainline-endpoint-discovery = "0.1.1"
n0-mainline = "0.7.1"
reed-solomon-simd = "3.1.0"
rustls = { version = "0.23.46", default-features = false, features = ["prefer-post-quantum"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "fs", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
rpath = false
overflow-checks = false

